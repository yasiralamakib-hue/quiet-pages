<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author desk — The Quiet Pages</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin-body"><header class="site-header"><a class="brand" href="index.html">The Quiet Pages<span>AUTHOR DESK</span></a><nav><a href="index.html">← View journal</a></nav></header><main class="admin-main"><section id="sign-in" class="sign-in card"><p class="eyebrow">PRIVATE AUTHOR AREA</p><h1>Your writing desk</h1><p class="muted">Sign in with the author email you configured in Supabase.</p><form id="login-form"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button" type="submit">Sign in</button><p class="form-message" aria-live="polite"></p></form></section>
<section id="dashboard" hidden><div class="section-heading"><div><p class="eyebrow">PRIVATE AUTHOR AREA</p><h1>Your writing desk</h1></div><button id="sign-out" class="text-button">Sign out</button></div><div class="admin-grid"><form id="post-form" class="card editor"><h2 id="editor-title">New page</h2><input name="id" type="hidden"><label>Title<input name="title" required maxlength="180"></label><label>Subtitle or short introduction<input name="excerpt" maxlength="280"></label><label>Section<select name="category"><option>Journal</option><option>Writing</option><option>Poetry</option><option>Photography</option></select></label><label>Your words<textarea name="body" rows="12" required placeholder="Begin anywhere…"></textarea></label><label>Photograph <input name="photo" type="file" accept="image/*"></label><label class="check"><input name="published" type="checkbox"> Publish this page for everyone to read</label><div class="actions"><button class="button" type="submit">Save page</button><button id="reset-form" class="text-button" type="button">Clear</button></div><p class="form-message" aria-live="polite"></p></form><aside class="card"><h2>Your pages</h2><div id="admin-posts"></div></aside></div></section></main><footer><span>THE QUIET PAGES</span><span>Only your account can manage pages.</span></footer><script type="module" src="app.js"></script></body></html>
